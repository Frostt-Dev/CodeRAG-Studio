services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coderag_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coderag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d coderag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgvector_data:
